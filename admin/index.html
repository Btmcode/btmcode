<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | BTMCode</title><link rel="stylesheet" href="/assets/site.css"><script src="/admin/config.js"></script><script defer src="/admin/admin.js"></script><style>.admin-login{max-width:450px;margin:9vh auto;border:1px solid var(--line);background:var(--panel);padding:32px}.admin-alert{padding:15px;border:1px solid rgba(199,243,107,.25);background:rgba(199,243,107,.05);font-size:12px;line-height:1.8;color:#bfccbd}.admin-field{display:block;margin:15px 0}.admin-field span{display:block;font:10px var(--mono);color:#aab5aa;margin-bottom:6px}.admin-field input{width:100%;background:#0b100d;border:1px solid var(--line);padding:12px;color:white}.admin-shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.admin-side{border-right:1px solid var(--line);padding:23px;background:#0d1310}.admin-main{padding:30px;min-width:0}.admin-nav{display:grid;gap:5px;margin-top:28px}.admin-nav button{background:transparent;border:1px solid transparent;text-align:left;padding:12px;color:#adb8ad;font-size:12px;cursor:pointer}.admin-nav button.active,.admin-nav button:hover{background:rgba(199,243,107,.07);border-color:rgba(199,243,107,.2);color:var(--accent)}.admin-card{border:1px solid var(--line);background:var(--panel);padding:20px;margin:12px 0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.admin-stat{border:1px solid var(--line);padding:19px;background:#111814}.admin-stat span{font:9px var(--mono);color:#8a968b}.admin-stat strong{display:block;font-size:32px;margin-top:9px}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 9px}.admin-table th{font:9px var(--mono);color:#819084}.admin-btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 12px;font-size:11px;cursor:pointer}.admin-btn.primary{background:var(--accent);color:#10160e;border-color:var(--accent);font-weight:800}.admin-status{font-size:12px;color:var(--muted);min-height:23px}.admin-input{width:100%;background:#0b100d;border:1px solid var(--line);padding:10px;color:white;margin:5px 0 12px}.table-wrap{overflow:auto}@media(max-width:760px){.admin-login{margin:7vh 17px;padding:23px}.admin-shell{grid-template-columns:1fr}.admin-side{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.admin-nav{display:flex;overflow:auto;margin-top:12px}.admin-nav button{white-space:nowrap}.admin-main{padding:16px}.admin-grid{grid-template-columns:1fr}.admin-table{min-width:650px}}</style></head><body><div id="admin-root"><section class="admin-login"><a class="brand" href="/"><span class="brand-mark">b/</span><span>BTMCode<small>ADMIN CONSOLE</small></span></a><div class="eyebrow" style="margin-top:28px">SECURE ACCESS</div><h1 style="font-size:32px;letter-spacing:-.07em;margin:12px 0">Yönetim paneli</h1><div class="admin-alert">Giriş, Supabase Auth ve Row Level Security ile çalışır. İlk kurulum için <a class="project-link" href="/setup/schema.sql">veritabanı şemasını aç ↗</a>.</div><p id="admin-status" class="admin-status">Bağlantı kontrol ediliyor…</p><a href="/" class="project-link">← Siteye dön</a></section></div></body></html>
