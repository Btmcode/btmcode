name: BTMCode quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d2b7b5a1b9c6e6c9a2c2d7c2d5a
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Static build
        run: npm run build
